name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  generate-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install Protoc
        uses: arduino/setup-protoc@149f6c87b92550901b26acd1632e11c3662e381f # v1.3.0

      - name: Checkout
        uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e # v2.8.0
        with:
          submodules: true

      - name: Setup go
        uses: actions/setup-go@0caeaed6fd66a828038c2da3c0f662a42862658f # v1.1.3
        with:
          go-version: 1.17

      - name: Install dependencies
        run: make install-deps

      - name: Generate JSON Schema
        run: make generate-json-schema

      - name: Release generated artifacts
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1 on 2026-11-26, TODO: use a release instead
        with:
          files: |
            build/**/*.json
